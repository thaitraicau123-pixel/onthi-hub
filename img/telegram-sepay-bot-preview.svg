  <text x="428" y="246" fill="#94A3B8" font-family="monospace" font-size="12">verifyApikey(req.headers.authorization)</text>
  <text x="428" y="272" fill="#60A5FA" font-family="monospace" font-size="12">const key = popAvailableKeyAtomic();</text>
  <text x="428" y="298" fill="#34D399" font-family="monospace" font-size="12">await bot.sendMessage(chatId, key);</text>
  <text x="428" y="324" fill="#FBBF24" font-family="monospace" font-size="12">await notifyAdminRevenue(order);</text>

